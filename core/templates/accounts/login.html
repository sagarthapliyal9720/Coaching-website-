<!-- accounts/templates/accounts/login.html -->
{% extends 'core/base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-ksDark py-16 px-4 sm:px-6 lg:px-8 relative overflow-hidden">

    <!-- Decorative background glow -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-ksGold/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full bg-ksCard p-8 rounded-2xl shadow-2xl border border-ksBorder relative z-10">
        <div class="text-center mb-6">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-ksGold/15 border border-ksGold/30 flex items-center justify-center text-ksGold text-2xl mb-4">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h2 class="text-3xl font-black text-white tracking-tight">Sign In</h2>
            <p class="text-slate-400 text-sm mt-1">Access your tests and notes</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="p-3 mb-4 text-sm rounded-lg bg-red-500/10 text-red-400 border border-red-500/30 flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1.5">Username</label>
                <input type="text" name="username" placeholder="Enter username" required class="w-full px-4 py-3 rounded-lg bg-ksDark border border-ksBorder text-slate-200 placeholder-slate-500 focus:ring-2 focus:ring-ksGold focus:border-ksGold outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1.5">Password</label>
                <input type="password" name="password" placeholder="Enter password" required class="w-full px-4 py-3 rounded-lg bg-ksDark border border-ksBorder text-slate-200 placeholder-slate-500 focus:ring-2 focus:ring-ksGold focus:border-ksGold outline-none transition">
            </div>

            <button type="submit" class="w-full gold-gradient text-ksDark font-bold py-3.5 rounded-lg transition-all mt-4 hover:opacity-90 shadow-lg shadow-ksGold/10 flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>

        <p class="text-center text-sm text-slate-400 mt-6">
            Don't have an account? <a href="{% url 'register' %}" class="text-ksGold font-bold hover:underline">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
