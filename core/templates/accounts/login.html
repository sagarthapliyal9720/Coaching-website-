<!-- accounts/templates/accounts/login.html -->
{% extends 'core/base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-100 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-md border border-slate-200">
        <div class="text-center mb-6">
            <h2 class="text-3xl font-extrabold text-slate-900">Sign In</h2>
            <p class="text-slate-500 text-sm mt-1">Access your tests and notes</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="p-3 mb-4 text-sm rounded-lg bg-red-100 text-red-700 border border-red-200">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                <input type="text" name="username" placeholder="Enter username" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-ksBlue outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" name="password" placeholder="Enter password" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-ksBlue outline-none">
            </div>

            <button type="submit" class="w-full bg-ksBlue hover:bg-slate-800 text-white font-bold py-3.5 rounded-lg transition-all mt-4">
                Sign In
            </button>
        </form>

        <p class="text-center text-sm text-slate-600 mt-6">
            Don't have an account? <a href="{% url 'register' %}" class="text-ksGold font-bold hover:underline">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
