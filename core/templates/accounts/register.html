<!-- accounts/templates/accounts/register.html -->
{% extends 'core/base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-100 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-md border border-slate-200">
        <div class="text-center mb-6">
            <h2 class="text-3xl font-extrabold text-slate-900">Create Account</h2>
            <p class="text-slate-500 text-sm mt-1">Join KS Coaching Platform</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="p-3 mb-4 text-sm rounded-lg bg-red-100 text-red-700 border border-red-200">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'register' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Select Role</label>
                <select name="role" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-ksBlue outline-none bg-white">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                <input type="text" name="username" placeholder="Choose a username" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-ksBlue outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Full Name</label>
                <input type="text" name="full_name" placeholder="Enter your full name" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-ksBlue outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
                <input type="email" name="email" placeholder="Enter email address" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-ksBlue outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Phone Number</label>
                <input type="tel" name="phone_number" placeholder="Enter phone number" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-ksBlue outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Class (Optional)</label>
                <input type="text" name="class_level" placeholder="e.g. 10th, 12th, or Leave Blank if Passout" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-ksBlue outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Batch (Optional)</label>
                <input type="text" name="batch" placeholder="e.g. Morning JEE 2026" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-ksBlue outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" name="password" placeholder="Create password" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-ksBlue outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm password" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-ksBlue outline-none">
            </div>

            <button type="submit" class="w-full bg-ksBlue hover:bg-slate-800 text-white font-bold py-3.5 rounded-lg transition-all mt-4">
                Register
            </button>
        </form>

        <p class="text-center text-sm text-slate-600 mt-6">
            Already have an account? <a href="{% url 'login' %}" class="text-ksGold font-bold hover:underline">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
