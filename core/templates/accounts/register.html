<!-- accounts/templates/accounts/register.html -->
{% extends 'core/base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-ksDark py-16 px-4 sm:px-6 lg:px-8 relative overflow-hidden">

    <!-- Decorative background glow -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-ksGold/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full bg-ksCard p-8 rounded-2xl shadow-2xl border border-ksBorder relative z-10">
        <div class="text-center mb-6">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-ksGold/15 border border-ksGold/30 flex items-center justify-center text-ksGold text-2xl mb-4">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 class="text-3xl font-black text-white tracking-tight">Create Account</h2>
            <p class="text-slate-400 text-sm mt-1">Join <span class="text-ksGold font-semibold">KS Coaching</span> Platform</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="p-3 mb-4 text-sm rounded-lg bg-red-500/10 text-red-400 border border-red-500/30 flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'register' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1.5">Select Role</label>
                <select name="role" required class="w-full px-4 py-3 rounded-lg bg-ksDark border border-ksBorder text-slate-200 focus:ring-2 focus:ring-ksGold focus:border-ksGold outline-none transition">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1.5">Username</label>
                <input type="text" name="username" placeholder="Choose a username" required class="w-full px-4 py-3 rounded-lg bg-ksDark border border-ksBorder text-slate-200 placeholder-slate-500 focus:ring-2 focus:ring-ksGold focus:border-ksGold outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1.5">Full Name</label>
                <input type="text" name="full_name" placeholder="Enter your full name" required class="w-full px-4 py-3 rounded-lg bg-ksDark border border-ksBorder text-slate-200 placeholder-slate-500 focus:ring-2 focus:ring-ksGold focus:border-ksGold outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1.5">Email</label>
                <input type="email" name="email" placeholder="Enter email address" required class="w-full px-4 py-3 rounded-lg bg-ksDark border border-ksBorder text-slate-200 placeholder-slate-500 focus:ring-2 focus:ring-ksGold focus:border-ksGold outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1.5">Phone Number</label>
                <input type="tel" name="phone_number" placeholder="Enter phone number" required class="w-full px-4 py-3 rounded-lg bg-ksDark border border-ksBorder text-slate-200 placeholder-slate-500 focus:ring-2 focus:ring-ksGold focus:border-ksGold outline-none transition">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1.5">Class <span class="text-slate-500 font-normal">(Optional)</span></label>
                    <input type="text" name="class_level" placeholder="e.g. 10th, 12th" class="w-full px-4 py-3 rounded-lg bg-ksDark border border-ksBorder text-slate-200 placeholder-slate-500 focus:ring-2 focus:ring-ksGold focus:border-ksGold outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1.5">Batch <span class="text-slate-500 font-normal">(Optional)</span></label>
                    <input type="text" name="batch" placeholder="e.g. Morning JEE" class="w-full px-4 py-3 rounded-lg bg-ksDark border border-ksBorder text-slate-200 placeholder-slate-500 focus:ring-2 focus:ring-ksGold focus:border-ksGold outline-none transition">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1.5">Password</label>
                <input type="password" name="password" placeholder="Create password" required class="w-full px-4 py-3 rounded-lg bg-ksDark border border-ksBorder text-slate-200 placeholder-slate-500 focus:ring-2 focus:ring-ksGold focus:border-ksGold outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1.5">Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm password" required class="w-full px-4 py-3 rounded-lg bg-ksDark border border-ksBorder text-slate-200 placeholder-slate-500 focus:ring-2 focus:ring-ksGold focus:border-ksGold outline-none transition">
            </div>

            <button type="submit" class="w-full gold-gradient text-ksDark font-bold py-3.5 rounded-lg transition-all mt-4 hover:opacity-90 shadow-lg shadow-ksGold/10 flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i> Register
            </button>
        </form>

        <p class="text-center text-sm text-slate-400 mt-6">
            Already have an account? <a href="{% url 'login' %}" class="text-ksGold font-bold hover:underline">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
