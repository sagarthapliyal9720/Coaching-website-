{% extends 'core/base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-ksDark py-12 px-4">
    <div class="max-w-2xl w-full bg-ksCard p-8 rounded-2xl shadow-xl border border-ksBorder">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-ksGold/15 flex items-center justify-center text-2xl text-ksGold">
                <i class="fa-solid fa-clipboard-list"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-white">Create New Test Series</h2>
            <p class="text-slate-400 text-sm mt-1">Set up a new mock test for your students</p>
        </div>

        <form method="POST" action="{% url 'create_test' %}" class="space-y-5">
            {% csrf_token %}

            <!-- Test Title -->
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1.5">Test Title</label>
                <input type="text" name="title" placeholder="e.g. JEE Main Mock Test - 1" required
                       class="w-full px-4 py-3 rounded-xl bg-ksDark border border-ksBorder text-white placeholder-slate-500 focus:ring-2 focus:ring-ksGold focus:border-transparent outline-none transition">
            </div>

            <!-- Category + Duration -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1.5">Select Category</label>
                    <select name="category" required
                            class="w-full px-4 py-3 rounded-xl bg-ksDark border border-ksBorder text-white focus:ring-2 focus:ring-ksGold focus:border-transparent outline-none transition">
                        {% for cat in categories %}
                            <option value="{{ cat.id }}" class="bg-ksDark">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1.5">Duration (Minutes)</label>
                    <input type="number" name="duration_minutes" placeholder="e.g. 60" required
                           class="w-full px-4 py-3 rounded-xl bg-ksDark border border-ksBorder text-white placeholder-slate-500 focus:ring-2 focus:ring-ksGold focus:border-transparent outline-none transition">
                </div>
            </div>

            <!-- Total Questions + Total Marks -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1.5">Total Questions Target</label>
                    <input type="number" name="total_questions" placeholder="e.g. 30" required
                           class="w-full px-4 py-3 rounded-xl bg-ksDark border border-ksBorder text-white placeholder-slate-500 focus:ring-2 focus:ring-ksGold focus:border-transparent outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1.5">Total Marks</label>
                    <input type="number" name="total_marks" placeholder="e.g. 100" required
                           class="w-full px-4 py-3 rounded-xl bg-ksDark border border-ksBorder text-white placeholder-slate-500 focus:ring-2 focus:ring-ksGold focus:border-transparent outline-none transition">
                </div>
            </div>

            <!-- Negative Marking Box -->
            <div class="bg-ksDark p-5 rounded-xl border border-ksBorder">
                <div class="flex items-center gap-3 mb-4">
                    <input type="checkbox" name="has_negative_marking" id="has_neg"
                           class="w-5 h-5 rounded border-ksBorder bg-ksCard text-ksGold focus:ring-ksGold focus:ring-offset-0">
                    <label for="has_neg" class="font-semibold text-white text-sm">Enable Negative Marking?</label>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5">Negative Marks Per Wrong Answer</label>
                    <input type="number" step="0.01" name="negative_marks_per_question" placeholder="e.g. 0.25"
                           class="w-full px-4 py-2.5 rounded-xl bg-ksCard border border-ksBorder text-white placeholder-slate-500 focus:ring-2 focus:ring-ksGold focus:border-transparent outline-none transition">
                </div>
            </div>

            <button type="submit"
                    class="w-full gold-gradient hover:opacity-90 text-ksDark font-bold py-3.5 rounded-xl transition shadow-md mt-2">
                <i class="fa-solid fa-arrow-right mr-2"></i> Save & Proceed to Add Questions
            </button>
        </form>
    </div>
</div>
{% endblock %}
